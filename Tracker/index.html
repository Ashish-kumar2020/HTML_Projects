
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search & Prep Tracker</title>
<!-- Chart.js CDN for Dashboard Visualizations -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --navy: #21315c;
    --navy-light: #2c4272;
    --text: #1a1a1a;
    --text-secondary: #5a5a5a;
    --border: #d8dbe0;
    --stripe: #f0f1f4;
    --red-bg: #f8d6d6;
    --red-text: #8a2020;
    --green-bg: #d9ecd3;
    --green-text: #2f6b21;
    --orange-bg: #fbe0cf;
    --orange-text: #9a5210;
  }

  [data-theme="dark"] {
    --bg: #0f1115;
    --surface: #181a1f;
    --navy: #253863;
    --navy-light: #304a80;
    --text: #eceeef;
    --text-secondary: #9a9ca3;
    --border: #2c2f36;
    --stripe: #1f2127;
    --red-bg: #4a2323;
    --red-text: #f0a3a3;
    --green-bg: #234a2a;
    --green-text: #a3e0ac;
    --orange-bg: #4a3420;
    --orange-text: #f0c090;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1300px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-inner h1 { font-size: 16px; font-weight: 600; }

  .theme-toggle {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; font-size: 15px;
  }

  .tabs-bar {
    max-width: 1300px; margin: 0 auto; padding: 0 24px;
    display: flex; gap: 2px; overflow-x: auto;
  }

  .tab-btn {
    padding: 9px 14px; border: none; background: none;
    color: var(--text-secondary); font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  [data-theme="dark"] .tab-btn.active { color: #7fa3e0; border-bottom-color: #7fa3e0; }

  .main-content { max-width: 1300px; margin: 0 auto; padding: 24px 24px 80px; }

  .section-block { margin-bottom: 36px; }

  .section-title-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
  }

  .banner {
    background: var(--navy); color: #fff; font-weight: 700;
    font-size: 15px; padding: 12px 16px; border-radius: 6px;
    margin-bottom: 14px;
  }

  .subheading {
    font-size: 14px; font-weight: 700; color: var(--navy);
    margin: 4px 0 10px;
  }
  [data-theme="dark"] .subheading { color: #7fa3e0; }

  .action-row { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12.5px;
    font-weight: 500; cursor: pointer;
  }
  .btn:hover { background: var(--stripe); }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.primary:hover { background: var(--navy-light); }

  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: center; padding: 10px 10px; background: var(--navy);
    color: #fff; font-weight: 700; font-size: 12.5px; white-space: nowrap;
  }

  tbody td {
    padding: 3px 4px; border-bottom: 1px solid var(--border);
    text-align: center; vertical-align: middle;
  }

  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { filter: brightness(0.97); }
  [data-theme="dark"] tbody tr:hover { filter: brightness(1.15); }

  .cell-input {
    width: 100%; min-width: 80px; padding: 7px 6px; border: 1px solid transparent;
    background: transparent; color: var(--text); font-size: 13px;
    font-family: inherit; border-radius: 4px; text-align: center;
  }
  .cell-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
  td:first-child .cell-input, td:nth-child(2) .cell-input { text-align: left; }

  select.cell-input { cursor: pointer; }

  .pct-cell { font-weight: 700; }
  .pct-red { background: var(--red-bg) !important; color: var(--red-text); }
  .pct-green { background: var(--green-bg) !important; color: var(--green-text); }
  .pct-orange { background: var(--orange-bg) !important; color: var(--orange-text); }

  .row-actions { width: 32px; padding: 3px !important; }
  .icon-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 14px; padding: 3px 5px; border-radius: 4px;
  }
  .icon-btn:hover { color: var(--red-text); background: var(--red-bg); }

  .add-row-strip { padding: 8px 10px; border-top: 1px solid var(--border); }
  .add-row-btn {
    background: none; border: none; color: var(--text-secondary);
    font-size: 12.5px; cursor: pointer; padding: 5px 8px; border-radius: 5px;
  }
  .add-row-btn:hover { background: var(--stripe); color: var(--text); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 13.5px; }

  /* Dashboard Styles */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .stat-card .label {
    font-size: 12.5px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-card .value {
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
    margin-top: 8px;
  }
  [data-theme="dark"] .stat-card .value { color: #7fa3e0; }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .chart-container {
    position: relative;
    max-height: 320px;
    width: 100%;
    margin: 0 auto;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface); border-radius: 10px; padding: 20px; width: 300px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h3 { font-size: 14px; margin-bottom: 12px; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text);
    font-size: 13px; margin-bottom: 10px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 640px) {
    .main-content { padding: 18px 14px 60px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-inner">
    <h1>Job Search & Prep Tracker</h1>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
  <div class="tabs-bar" id="tabsBar"></div>
</div>

<div class="main-content" id="mainContent"></div>

<div class="modal-overlay" id="columnModal">
  <div class="modal-box">
    <h3>Add new column</h3>
    <input type="text" id="newColName" placeholder="Column name" />
    <select id="newColType">
      <option value="text">Text</option>
      <option value="select-status">Status dropdown</option>
      <option value="select-difficulty">Difficulty dropdown</option>
      <option value="select-priority">Priority dropdown</option>
      <option value="date">Date</option>
      <option value="number">Number</option>
    </select>
    <div class="modal-actions">
      <button class="btn" onclick="closeColumnModal()">Cancel</button>
      <button class="btn primary" onclick="confirmAddColumn()">Add column</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'jsp_tracker_v2';
const THEME_KEY = 'jsp_theme_v2';
let memoryStore = {};
function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; } }
function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { memoryStore[key] = value; } }

const STATUS_OPTIONS = ['', 'Not started', 'In progress', 'Done', 'Skipped'];
const DIFFICULTY_OPTIONS = ['', 'Easy', 'Medium', 'Hard'];
const PRIORITY_OPTIONS = ['', 'Low', 'Medium', 'High'];

let chartInstances = {};

function newTable(columns) {
  return { columns, rows: [] };
}

const defaultSchema = {
  dashboard: {
    label: 'Dashboard'
  },
  dsa: {
    label: 'DSA Tracker',
    sections: [
      { title: 'Topic-wise Progress',
        table: newTable([
          {id:'date', name:'Date', type:'date'},
          {id:'topic', name:'Topic', type:'text'},
          {id:'target', name:'Target #', type:'number'},
          {id:'solved', name:'Solved', type:'number'},
          {id:'remaining', name:'Remaining', type:'number'},
          {id:'pct', name:'% Complete', type:'computed-pct'},
          {id:'revision', name:'Date Revision', type:'date'}
        ]) },
      { title: 'Problem Log',
        table: newTable([
          {id:'date', name:'Date', type:'date'},
          {id:'topic', name:'Topic', type:'text'},
          {id:'problem', name:'Problem Name', type:'text'},
          {id:'platform', name:'Platform', type:'text'},
          {id:'difficulty', name:'Difficulty', type:'select-difficulty'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'time', name:'Time (min)', type:'text'},
          {id:'notes', name:'Approach / Notes', type:'text'},
          {id:'link', name:'Link', type:'text'}
        ]) }
    ]
  },
  react: {
    label: 'React Skill Tracker',
    sections: [
      { title: 'React Skill Tracker', banner: true,
        table: newTable([
          {id:'date', name:'Date', type:'date'},
          {id:'topic', name:'Topic', type:'text'},
          {id:'subtopic', name:'Subtopic', type:'text'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'priority', name:'Priority', type:'select-priority'},
          {id:'resource', name:'Resource', type:'text'},
          {id:'notes', name:'Notes', type:'text'},
          {id:'revision', name:'Date Revision', type:'date'}
        ]) }
    ]
  },
  machineCoding: {
    label: 'Machine Coding',
    sections: [
      { title: 'Machine Coding Rounds',
        table: newTable([
          {id:'date', name:'Date', type:'date'},
          {id:'problem', name:'Problem', type:'text'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'time', name:'Time taken', type:'text'},
          {id:'notes', name:'Notes', type:'text'}
        ]) }
    ]
  },
  systemDesign: {
    label: 'Frontend System Design',
    sections: [
      { title: 'Frontend System Design',
        table: newTable([
          {id:'topic', name:'Topic', type:'text'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'priority', name:'Priority', type:'select-priority'},
          {id:'notes', name:'Key points', type:'text'}
        ]) }
    ]
  },
  projects: {
    label: 'Projects',
    sections: [
      { title: 'Projects',
        table: newTable([
          {id:'name', name:'Project name', type:'text'},
          {id:'stack', name:'Stack', type:'text'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'link', name:'Link', type:'text'}
        ]) }
    ]
  },
  resume: {
    label: 'Resume Versions',
    sections: [
      { title: 'Resume Versions',
        table: newTable([
          {id:'version', name:'Version name', type:'text'},
          {id:'date', name:'Date', type:'date'},
          {id:'changes', name:'Changes made', type:'text'},
          {id:'link', name:'File link', type:'text'}
        ]) }
    ]
  },
  applications: {
    label: 'Job Applications',
    sections: [
      { title: 'Job Application Tracker', banner: true,
        table: newTable([
          {id:'dateApplied', name:'Date Applied', type:'date'},
          {id:'company', name:'Company', type:'text'},
          {id:'role', name:'Role', type:'text'},
          {id:'source', name:'Source', type:'select-priority'},
          {id:'status', name:'Status', type:'select-status'},
          {id:'nextStep', name:'Next Step', type:'text'},
          {id:'followUp', name:'Follow-up Date', type:'date'},
          {id:'contact', name:'Contact / Referral', type:'text'},
          {id:'round', name:'Round', type:'text'},
          {id:'notes', name:'Notes', type:'text'}
        ]) }
    ]
  },
  interviews: {
    label: 'Interview Experiences',
    sections: [
      { title: 'Interview Experiences',
        table: newTable([
          {id:'company', name:'Company', type:'text'},
          {id:'round', name:'Round', type:'text'},
          {id:'date', name:'Date', type:'date'},
          {id:'experience', name:'Experience', type:'text'},
          {id:'result', name:'Result', type:'select-status'}
        ]) }
    ]
  },
  dailyGoals: {
    label: 'Daily Goals',
    sections: [
      { title: 'Daily Goals',
        table: newTable([
          {id:'date', name:'Date', type:'date'},
          {id:'goal', name:'Goal', type:'text'},
          {id:'status', name:'Status', type:'select-status'}
        ]) }
    ]
  },
  revision: {
    label: 'Revision Planner',
    sections: [
      { title: 'Revision Planner',
        table: newTable([
          {id:'topic', name:'Topic', type:'text'},
          {id:'lastRevised', name:'Last revised', type:'date'},
          {id:'nextDue', name:'Next due', type:'date'},
          {id:'status', name:'Status', type:'select-status'}
        ]) }
    ]
  }
};

let data = loadData();
let currentTab = Object.keys(data)[0];
let pendingColMeta = null;

function loadData() {
  const raw = storageGet(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      Object.keys(defaultSchema).forEach(key => {
        if (!parsed[key]) parsed[key] = JSON.parse(JSON.stringify(defaultSchema[key]));
      });
      return parsed;
    } catch (e) { return JSON.parse(JSON.stringify(defaultSchema)); }
  }
  return JSON.parse(JSON.stringify(defaultSchema));
}
function saveData() { storageSet(STORAGE_KEY, JSON.stringify(data)); }
function uid() { return 'r' + Math.random().toString(36).slice(2, 10); }

function renderTabs() {
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  Object.keys(data).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === currentTab ? ' active' : '');
    btn.textContent = data[key].label;
    btn.onclick = () => { currentTab = key; renderTabs(); renderContent(); };
    bar.appendChild(btn);
  });
}

function getOptionsForType(type) {
  if (type === 'select-status') return STATUS_OPTIONS;
  if (type === 'select-difficulty') return DIFFICULTY_OPTIONS;
  if (type === 'select-priority') return PRIORITY_OPTIONS;
  return [];
}

function computePct(row, table) {
  const done = parseFloat(row.done ?? row.solved ?? 0) || 0;
  let total = parseFloat(row.total ?? row.target ?? 0) || 0;
  if (!total) return '';
  const pct = Math.round((done / total) * 100);
  return pct;
}

function pctClass(pct) {
  if (pct === '' || pct === null || isNaN(pct)) return '';
  if (pct >= 80) return 'pct-green';
  if (pct >= 40) return 'pct-orange';
  return 'pct-red';
}

/* =========================================
   AUTOMATED DATA AGGREGATION & DASHBOARD
   ========================================= */

function computeDashboardMetrics() {
  // 1. Applications Funnel
  const appRows = data.applications?.sections[0]?.table?.rows || [];
  const funnel = { 'Not started': 0, 'In progress': 0, 'Done': 0, 'Skipped': 0, 'Unassigned': 0 };
  appRows.forEach(r => {
    const s = r.status || 'Unassigned';
    funnel[s] = (funnel[s] || 0) + 1;
  });

  // 2. DSA Metrics
  const dsaTopicRows = data.dsa?.sections[0]?.table?.rows || [];
  let dsaTarget = 0, dsaSolved = 0;
  dsaTopicRows.forEach(r => {
    dsaTarget += parseFloat(r.target || 0);
    dsaSolved += parseFloat(r.solved || 0);
  });

  const dsaLogRows = data.dsa?.sections[1]?.table?.rows || [];
  const dsaDifficulty = { 'Easy': 0, 'Medium': 0, 'Hard': 0 };
  dsaLogRows.forEach(r => {
    if (r.difficulty && dsaDifficulty[r.difficulty] !== undefined) {
      dsaDifficulty[r.difficulty]++;
    }
  });

  // 3. Module Completion Breakdown (React, Machine Coding, System Design)
  function getCompletion(tabKey) {
    const rows = data[tabKey]?.sections[0]?.table?.rows || [];
    const done = rows.filter(r => r.status === 'Done').length;
    return { done, total: rows.length };
  }

  const reactStats = getCompletion('react');
  const mcStats = getCompletion('machineCoding');
  const sdStats = getCompletion('systemDesign');

  return {
    totalApplications: appRows.length,
    funnel,
    dsa: { target: dsaTarget, solved: dsaSolved, difficulty: dsaDifficulty, logCount: dsaLogRows.length },
    modules: {
      React: reactStats,
      'Machine Coding': mcStats,
      'System Design': sdStats
    }
  };
}

function destroyCharts() {
  Object.keys(chartInstances).forEach(key => {
    if (chartInstances[key]) {
      chartInstances[key].destroy();
    }
  });
  chartInstances = {};
}

function renderDashboard() {
  const container = document.getElementById('mainContent');
  destroyCharts();

  const metrics = computeDashboardMetrics();
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#eceeef' : '#1a1a1a';
  const gridColor = isDark ? '#2c2f36' : '#d8dbe0';

  container.innerHTML = `
    <div class="banner">Overall Progress & Analytics Dashboard</div>
    
    <!-- Quick Stats Cards -->
    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="label">Total Job Applications</div>
        <div class="value">${metrics.totalApplications}</div>
      </div>
      <div class="stat-card">
        <div class="label">DSA Solved (Topics)</div>
        <div class="value">${metrics.dsa.solved} / ${metrics.dsa.target}</div>
      </div>
      <div class="stat-card">
        <div class="label">DSA Problems Logged</div>
        <div class="value">${metrics.dsa.logCount}</div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="dashboard-grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
      
      <!-- Application Pipeline Chart -->
      <div class="chart-card">
        <div class="subheading">Application Pipeline Status</div>
        <div class="chart-container">
          <canvas id="funnelChart"></canvas>
        </div>
      </div>

      <!-- DSA Target vs Solved Chart -->
      <div class="chart-card">
        <div class="subheading">DSA Completion Target</div>
        <div class="chart-container">
          <canvas id="dsaGaugeChart"></canvas>
        </div>
      </div>

      <!-- DSA Difficulty Breakdown -->
      <div class="chart-card">
        <div class="subheading">Solved Problems by Difficulty</div>
        <div class="chart-container">
          <canvas id="dsaDiffChart"></canvas>
        </div>
      </div>

      <!-- Preparation Module Completion -->
      <div class="chart-card">
        <div class="subheading">Module Completion Rate (% Done)</div>
        <div class="chart-container">
          <canvas id="modulesChart"></canvas>
        </div>
      </div>

    </div>
  `;

  // Chart 1: Application Funnel Bar Chart
  const funnelCtx = document.getElementById('funnelChart').getContext('2d');
  chartInstances.funnel = new Chart(funnelCtx, {
    type: 'bar',
    data: {
      labels: Object.keys(metrics.funnel),
      datasets: [{
        label: 'Applications',
        data: Object.values(metrics.funnel),
        backgroundColor: ['#5a5a5a', '#9a5210', '#2f6b21', '#8a2020', '#2c4272'],
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: textColor }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } }
      }
    }
  });

  // Chart 2: DSA Target Gauge (Doughnut)
  const remainingTarget = Math.max(0, metrics.dsa.target - metrics.dsa.solved);
  const dsaGaugeCtx = document.getElementById('dsaGaugeChart').getContext('2d');
  chartInstances.dsaGauge = new Chart(dsaGaugeCtx, {
    type: 'doughnut',
    data: {
      labels: ['Solved', 'Remaining'],
      datasets: [{
        data: [metrics.dsa.solved, remainingTarget],
        backgroundColor: ['#2f6b21', isDark ? '#2c2f36' : '#e0e0e0'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: textColor } }
      }
    }
  });

  // Chart 3: DSA Difficulty Pie Chart
  const diffCtx = document.getElementById('dsaDiffChart').getContext('2d');
  chartInstances.dsaDiff = new Chart(diffCtx, {
    type: 'pie',
    data: {
      labels: Object.keys(metrics.dsa.difficulty),
      datasets: [{
        data: Object.values(metrics.dsa.difficulty),
        backgroundColor: ['#2f6b21', '#9a5210', '#8a2020'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: textColor } }
      }
    }
  });

  // Chart 4: Module Completion Rates
  const moduleLabels = Object.keys(metrics.modules);
  const modulePcts = moduleLabels.map(k => {
    const m = metrics.modules[k];
    return m.total > 0 ? Math.round((m.done / m.total) * 100) : 0;
  });

  const modulesCtx = document.getElementById('modulesChart').getContext('2d');
  chartInstances.modules = new Chart(modulesCtx, {
    type: 'bar',
    data: {
      labels: moduleLabels,
      datasets: [{
        label: '% Completed',
        data: modulePcts,
        backgroundColor: '#2c4272',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: textColor }, grid: { color: gridColor } },
        y: { 
          min: 0, max: 100, 
          ticks: { color: textColor, callback: v => v + '%' }, 
          grid: { color: gridColor } 
        }
      }
    }
  });
}

/* =========================================
   STANDARD CONTENT & TABLE RENDERING
   ========================================= */

function renderContent() {
  const container = document.getElementById('mainContent');
  
  if (currentTab === 'dashboard') {
    renderDashboard();
    return;
  }

  destroyCharts();
  const tab = data[currentTab];
  container.innerHTML = '';

  tab.sections.forEach((section, sIdx) => {
    const block = document.createElement('div');
    block.className = 'section-block';

    if (section.banner) {
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = section.title;
      block.appendChild(banner);
    } else {
      const titleRow = document.createElement('div');
      titleRow.className = 'section-title-row';
      const h = document.createElement('div');
      h.className = 'subheading';
      h.textContent = section.title;
      titleRow.appendChild(h);
      block.appendChild(titleRow);
    }

    const actionRow = document.createElement('div');
    actionRow.className = 'section-title-row';
    actionRow.style.marginTop = '-4px';
    const spacer = document.createElement('div');
    actionRow.appendChild(spacer);
    const actions = document.createElement('div');
    actions.className = 'action-row';
    const addColBtn = document.createElement('button');
    addColBtn.className = 'btn';
    addColBtn.textContent = '+ Column';
    addColBtn.onclick = () => openColumnModal(sIdx);
    const addRowBtn = document.createElement('button');
    addRowBtn.className = 'btn primary';
    addRowBtn.textContent = '+ Entry';
    addRowBtn.onclick = () => { addRow(section.table); renderContent(); };
    actions.appendChild(addColBtn);
    actions.appendChild(addRowBtn);
    actionRow.appendChild(actions);
    block.appendChild(actionRow);

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';

    if (section.table.rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state">No entries yet.</div>`;
    } else {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      section.table.columns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col.name;
        headRow.appendChild(th);
      });
      headRow.appendChild(document.createElement('th'));
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      section.table.rows.forEach(row => {
        const tr = document.createElement('tr');
        section.table.columns.forEach(col => {
          const td = document.createElement('td');
          if (col.type === 'computed-pct') {
            const pct = computePct(row, section.table);
            td.className = 'pct-cell ' + pctClass(pct);
            td.textContent = pct === '' ? '-' : pct + '%';
          } else {
            td.appendChild(makeCellInput(row, col, section.table));
          }
          tr.appendChild(td);
        });
        const actionTd = document.createElement('td');
        actionTd.className = 'row-actions';
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = () => {
          section.table.rows = section.table.rows.filter(r => r.id !== row.id);
          saveData(); renderContent();
        };
        actionTd.appendChild(delBtn);
        tr.appendChild(actionTd);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }

    const addStrip = document.createElement('div');
    addStrip.className = 'add-row-strip';
    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn';
    addBtn.textContent = '+ Add entry';
    addBtn.onclick = () => { addRow(section.table); renderContent(); };
    addStrip.appendChild(addBtn);
    wrap.appendChild(addStrip);

    block.appendChild(wrap);
    container.appendChild(block);
  });
}

function makeCellInput(row, col, table) {
  const opts = getOptionsForType(col.type);
  if (opts.length) {
    const select = document.createElement('select');
    select.className = 'cell-input';
    opts.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt || '—';
      if ((row[col.id] || '') === opt) o.selected = true;
      select.appendChild(o);
    });
    select.onchange = () => { row[col.id] = select.value; saveData(); renderContent(); };
    return select;
  }
  if (col.type === 'date') {
    const input = document.createElement('input');
    input.type = 'date'; input.className = 'cell-input';
    input.value = row[col.id] || '';
    input.onchange = () => { row[col.id] = input.value; saveData(); };
    return input;
  }
  if (col.type === 'number') {
    const input = document.createElement('input');
    input.type = 'number'; input.className = 'cell-input';
    input.value = row[col.id] ?? '';
    input.onchange = () => { row[col.id] = input.value; saveData(); renderContent(); };
    return input;
  }
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'cell-input';
  input.value = row[col.id] || '';
  input.onchange = () => { row[col.id] = input.value; saveData(); };
  return input;
}

function addRow(table) {
  const newRow = { id: uid() };
  table.columns.forEach(col => {
    if (col.type === 'computed-pct') return;
    newRow[col.id] = '';
  });
  table.rows.push(newRow);
  saveData();
}

function openColumnModal(sectionIdx) {
  pendingColMeta = { tabKey: currentTab, sectionIdx };
  document.getElementById('newColName').value = '';
  document.getElementById('columnModal').classList.add('open');
  document.getElementById('newColName').focus();
}
function closeColumnModal() {
  document.getElementById('columnModal').classList.remove('open');
  pendingColMeta = null;
}
function confirmAddColumn() {
  const name = document.getElementById('newColName').value.trim();
  const type = document.getElementById('newColType').value;
  if (!name || !pendingColMeta) return;
  const section = data[pendingColMeta.tabKey].sections[pendingColMeta.sectionIdx];
  const id = 'col_' + Math.random().toString(36).slice(2, 8);
  section.table.columns.push({ id, name, type });
  section.table.rows.forEach(row => { row[id] = ''; });
  saveData();
  closeColumnModal();
  renderContent();
}

function initTheme() {
  const saved = storageGet(THEME_KEY) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  storageSet(THEME_KEY, next);
  if (currentTab === 'dashboard') {
    renderDashboard();
  }
};
document.getElementById('columnModal').addEventListener('click', (e) => {
  if (e.target.id === 'columnModal') closeColumnModal();
});

initTheme();
renderTabs();
renderContent();
</script>

</body>
